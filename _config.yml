about_content: |
  Hi, I'm Trien! 👋

  A proactive undergraduate in Networking with a strong interest in backend programming and developing network-driven applications. Continuously expanding expertise in networking and cybersecurity through dedicated learning and personal projects. Actively seeking practical experiences to complement academic knowledge and accelerate growth. Currently pursuing internship or junior opportunities to apply my technical skills, contribute value, and develop professionally within a supportive environment.

