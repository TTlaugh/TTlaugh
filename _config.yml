      #############
      - layout: top-middle
        border: weak
        title: Quizz
        sub_title: Founder & Primary Backend Developer
        link: github.com/ttasc/Quizz
        # link_text: visit
        quote: >
          Quiz management system for schools, teachers or simply want to organize a quiz test.
        description: |
          <div align="center">
            <img align="center" width="70%" src="./prjimg/Quizz.png" />
          </div>

          I started this project as a way to learn about **Java** and **OOP**. In its early days, it was just a simple CLI software without a database. With the collaboration of my friends at university, I continued to develop it into a beautiful **GUI** application that can be used over a **LAN**. Although it is not yet production-ready due to existing bugs and incomplete features (*primarily within the GUI processing layer*), I successfully developed and solidified the core *backend* functionality, ensuring its smooth operation.

          <mark>JavaFX</mark> <mark>Socket</mark> <mark>Multithreading</mark> <mark>MariaDB/MySQL</mark> <mark>Networking</mark> <mark>Excel Processing</mark>

      ###################
      ### Go Projects ###
      ###################
      - layout: top-middle
        border: weak
        title: Go Projects
        sub_title: Primary Developer
        # link: github.com/ttasc
        # link_text: visit
        additional_links:
          - title:  sgublogsite
            icon:   fab fa-github
            url:    github.com/ttasc/sgublogsite
          - title:  craftt
            icon:   fab fa-github
            url:    github.com/ttasc/craftt
        quote: >
          These are projects written in Go.
        description: |
          <div align="center">
            <img align="center" width="70%" src="./prjimg/sgublogsite.png" />
          </div>

          **[sgublogsite](https://github.com/ttasc/sgublogsite)**: During my internship as a System Administrator, alongside core responsibilities of deploying, monitoring, and maintaining requested services, I embarked on developing a school news website. Driven by a desire to learn, this project provided me with valuable experience in: web development process (outside my expertise), practical Go programming and library usage, and foundational web security principles. A website with simple technology for stability and security. However, due to limitations in frontend implementation, the project remains incomplete. I made the decision to discontinue development to focus on new projects better aligned with my core competencies and career goals.
            - <mark>Go</mark> <mark>Chi</mark> <mark>HTMX</mark> <mark>MariaDB/MySQL</mark>

          <br/>

          <div align="center">
            <img align="center" width="70%" src="./prjimg/craftt.png" />
          </div>
          **[craftt](https://github.com/ttasc/craftt)** was born from observing my brother's struggle to manage our Proxmox-hosted Minecraft server due to limited terminal/SSH knowledge. This web app simplifies server control with one-click start/stop, live log viewing, and command execution. Beyond solving accessibility issues, it became a learning platform where I mastered Linux container process control, built secure TLS-enabled Go servers, and engineered real-time WebSocket data streaming for log interactions.
            - <mark>Go</mark> <mark>Process handling</mark> <mark>WebSocket</mark> <mark>TLS</mark>

